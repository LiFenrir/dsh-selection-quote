<svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Selection frame: the quoted region inside a message. -->
  <rect x="4" y="6" width="28" height="24" rx="6" stroke="#7FA6FF" stroke-width="2" stroke-dasharray="4 3" />
  <!-- Quote marks: the one-click action that turns a selection into a quote block. -->
  <path d="M12.4 14.2h3.3c.5 0 .9.4.9.9v3.6c0 .5-.4.9-.9.9h-3.3a.9.9 0 0 1-.9-.9v-3.6c0-.5.4-.9.9-.9z" fill="#4C7DFF" />
  <path d="M19.4 14.2h3.3c.5 0 .9.4.9.9v3.6c0 .5-.4.9-.9.9h-3.3a.9.9 0 0 1-.9-.9v-3.6c0-.5.4-.9.9-.9z" fill="#4C7DFF" />
  <!-- Quoted text lines flowing under the marks. -->
  <path d="M12 23.6h11.6" stroke="#9FBFFF" stroke-width="2" stroke-linecap="round" />
</svg>
